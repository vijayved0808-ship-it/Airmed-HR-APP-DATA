<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Airmed Lab - Employee App</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#ffffff">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; color: #0f172a; padding: 20px; }
        
        .app-container { background: #ffffff; width: 100%; max-width: 420px; padding: 40px 30px; border-radius: 24px; box-shadow: 0 10px 40px -10px rgba(0,0,0,0.1); border: 1px solid #f1f5f9; text-align: center; }
        
        .logo { font-size: 26px; font-weight: 700; color: #1e3a8a; margin-bottom: 30px; display: flex; align-items: center; justify-content: center; gap: 10px; }
        
        .input-group { position: relative; margin-bottom: 15px; }
        .input-group i { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: #64748b; }
        input, textarea { width: 100%; padding: 16px 16px 16px 45px; border: 1px solid #e2e8f0; border-radius: 12px; font-size: 15px; background: #f8fafc; transition: 0.2s; outline: none; }
        input:focus, textarea:focus { border-color: #3b82f6; background: #ffffff; box-shadow: 0 0 0 3px rgba(59,130,246,0.1); }
        textarea { padding-left: 16px; resize: none; margin-bottom: 10px; }
        
        button { width: 100%; padding: 16px; border: none; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; transition: 0.2s; color: white; display: flex; justify-content: center; align-items: center; gap: 8px; margin-bottom: 12px; }
        button:active { transform: scale(0.98); }
        
        /* PULSING INSTALL BUTTON */
        .btn-install { background: #1e293b; color: white; margin-bottom: 30px; display: flex; animation: pulseInstall 2s infinite; }
        @keyframes pulseInstall { 0% { box-shadow: 0 0 0 0 rgba(30,41,59,0.4); } 70% { box-shadow: 0 0 0 10px rgba(30,41,59,0); } 100% { box-shadow: 0 0 0 0 rgba(30,41,59,0); } }
        
        .btn-login { background: #3b82f6; box-shadow: 0 4px 12px rgba(59,130,246,0.3); }
        .btn-in { background: #10b981; box-shadow: 0 4px 12px rgba(16,185,129,0.3); }
        .btn-out { background: #ef4444; box-shadow: 0 4px 12px rgba(239,68,68,0.3); }
        .btn-history { background: white; border: 1px solid #cbd5e1; color: #475569; }
        
        #dashboard, #historySection { display: none; }
        .status-badge { background: #f8fafc; padding: 12px; border-radius: 12px; border: 1px solid #e2e8f0; font-size: 13px; font-weight: 500; margin-bottom: 20px; display: inline-flex; align-items: center; gap: 8px; }
        .dot { height: 10px; width: 10px; background: #10b981; border-radius: 50%; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(16,185,129,0.7); } 70% { box-shadow: 0 0 0 6px rgba(16,185,129,0); } 100% { box-shadow: 0 0 0 0 rgba(16,185,129,0); } }

        .stats-grid { display: flex; gap: 10px; margin-bottom: 20px; }
        .stat-card { flex: 1; background: white; padding: 15px; border-radius: 16px; font-size: 12px; font-weight: 600; border: 1px solid #e2e8f0; }
        
        .table-wrapper { max-height: 300px; overflow-y: auto; border: 1px solid #e2e8f0; border-radius: 12px; }
        table { width: 100%; border-collapse: collapse; font-size: 12px; text-align: left; }
        th { background: #f8fafc; color: #64748b; padding: 12px; position: sticky; top: 0; font-weight: 600; }
        td { padding: 12px; border-bottom: 1px solid #f1f5f9; }
    </style>
</head>
<body>

    <div class="app-container" id="loginBox">
        <div class="logo"><i class="fas fa-heartbeat"></i> Airmed Lab</div>
        
        <button class="btn-install" id="pwaBtn" onclick="triggerInstall()"><i class="fas fa-mobile-alt"></i> Install Web App</button>
        
        <div class="input-group"><i class="fas fa-user"></i><input type="text" id="empId" placeholder="Employee ID"></div>
        <div class="input-group"><i class="fas fa-lock"></i><input type="password" id="password" placeholder="Password"></div>
        
        <button class="btn-login" onclick="login()"><i class="fas fa-sign-in-alt"></i> Login Securely</button>
    </div>

    <div class="app-container" id="dashboard">
        <div class="logo"><i class="fas fa-heartbeat"></i> Airmed Lab</div>
        <h3 id="welcomeText" style="margin-bottom:10px;">Welcome</h3>
        
        <div class="status-badge" id="gpsStatus"><i class="fas fa-spinner fa-spin"></i> Fetching Tracker...</div>
        
        <textarea id="punchRemark" rows="2" placeholder="Session Remark (e.g. Visited Client X)"></textarea>
        <button class="btn-in" onclick="punch('IN')"><i class="fas fa-fingerprint"></i> PUNCH IN</button>
        <button class="btn-out" onclick="punch('OUT')"><i class="fas fa-sign-out-alt"></i> PUNCH OUT</button>
        
        <button class="btn-history" style="margin-top:20px;" onclick="loadHistory()"><i class="fas fa-history"></i> View Logs</button>
        <button onclick="logout()" style="background:none; color:#ef4444; border:none; margin-top:5px; padding:10px; width:auto; display:inline-block;"><i class="fas fa-power-off"></i> Logout</button>
    </div>

    <div class="app-container" id="historySection">
        <h3 style="margin-bottom:20px;"><i class="fas fa-calendar-check"></i> My History</h3>
        <div class="stats-grid">
            <div class="stat-card" style="color:#10b981;">Present<br><span id="statPresent" style="font-size:20px;">0</span></div>
            <div class="stat-card" style="color:#ef4444;">Missed<br><span id="statMissed" style="font-size:20px;">0</span></div>
        </div>
        <div class="table-wrapper">
            <table>
                <thead><tr><th>Date</th><th>In</th><th>Out</th><th>Status</th></tr></thead>
                <tbody id="historyBody"></tbody>
            </table>
        </div>
        <button class="btn-history" style="margin-top:15px;" onclick="backToDashboard()">Back</button>
    </div>

    <script>
        let currentLat = null, currentLng = null, currentAccuracy = null;

        function getGPS() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        currentLat = pos.coords.latitude; currentLng = pos.coords.longitude; currentAccuracy = pos.coords.accuracy;
                        document.getElementById('gpsStatus').innerHTML = `<div class="dot"></div> GPS Locked (±${Math.round(currentAccuracy)}m)`;
                    },
                    (err) => { document.getElementById('gpsStatus').innerHTML = `<i class="fas fa-exclamation-triangle" style="color:red;"></i> Allow GPS`; },
                    { enableHighAccuracy: true }
                );
            }
        }

        async function login() {
            const empId = document.getElementById('empId').value.trim();
            const password = document.getElementById('password').value.trim();
            if(!empId) return Swal.fire('Error', 'Enter ID', 'error');
            
            const res = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ empId, password }) });
            const data = await res.json();
            if (data.success) {
                localStorage.setItem('empId', data.empId); localStorage.setItem('empName', data.name);
                showDashboard(data.name);
            } else Swal.fire('Failed', data.message, 'error');
        }

        async function punch(type) {
            if (!currentLat) return Swal.fire('Wait', 'GPS stabilizing...', 'warning');
            // GPS Drift Intelligence (Accuracy) is passed here dynamically
            const res = await fetch('/api/punch', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ empId: localStorage.getItem('empId'), type, lat: currentLat, lng: currentLng, accuracy: currentAccuracy, remark: document.getElementById('punchRemark').value })
            });
            const data = await res.json();
            if (data.success) {
                Swal.fire({ title: `Punched ${type}`, text: data.message, icon: 'success', confirmButtonColor: '#3b82f6' });
                document.getElementById('punchRemark').value = '';
            } else Swal.fire('Rejected', data.message, 'error');
        }

        async function loadHistory() {
            document.getElementById('dashboard').style.display = 'none'; document.getElementById('historySection').style.display = 'block';
            const res = await fetch(`/api/employee/history?empId=${localStorage.getItem('empId')}`);
            const data = await res.json();
            
            let presentCount = 0, missedCount = 0;
            const tbody = document.getElementById('historyBody'); tbody.innerHTML = '';

            data.history.forEach(h => {
                if(h.status === 'Present' || h.status === 'Half Day') presentCount++; else missedCount++;
                let firstIn = h.punches && h.punches.find(p => p.type === 'IN');
                let lastOut = h.punches && [...h.punches].reverse().find(p => p.type === 'OUT');
                
                tbody.innerHTML += `<tr><td>${h.date.substring(5)}</td><td>${firstIn ? firstIn.time.slice(0,5) : '-'}</td><td>${lastOut ? lastOut.time.slice(0,5) : '-'}</td><td><b>${h.status}</b></td></tr>`;
            });
            document.getElementById('statPresent').innerText = presentCount; document.getElementById('statMissed').innerText = missedCount;
        }

        function backToDashboard() { document.getElementById('historySection').style.display = 'none'; document.getElementById('dashboard').style.display = 'block'; }
        function logout() { localStorage.clear(); location.reload(); }
        function showDashboard(name) { document.getElementById('loginBox').style.display = 'none'; document.getElementById('dashboard').style.display = 'block'; document.getElementById('welcomeText').innerText = `Hi, ${name.split(' ')[0]}`; getGPS(); }
        
        if (localStorage.getItem('empId')) showDashboard(localStorage.getItem('empName'));

        // ===================================
        // PWA SETUP & INSTALL (INTELLIGENT)
        // ===================================
        let deferredPrompt;
        if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');
        
        window.addEventListener('beforeinstallprompt', (e) => { 
            e.preventDefault(); 
            deferredPrompt = e; 
            // Only show button if app is installable
            document.getElementById('pwaBtn').style.display = 'flex'; 
        });

        async function triggerInstall() {
            if (deferredPrompt) {
                deferredPrompt.prompt(); 
                deferredPrompt = null; 
                document.getElementById('pwaBtn').style.display = 'none';
            } else {
                Swal.fire({ title: 'App Install Instruction', html: `1. Tap Chrome's <b>3-dot menu (⋮)</b> (top right).<br>2. Select <b>Add to Home Screen</b> or <b>Install App</b>.<br>3. Done!`, icon: 'info', confirmButtonColor: '#3b82f6' });
            }
        }
    </script>
</body>
</html>

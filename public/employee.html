<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Airmed Lab - Employee Portal</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#1e3a8a">
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f0f4f8; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background: white; width: 100%; max-width: 400px; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; margin: 15px; }
        .logo { font-size: 26px; font-weight: 900; color: #1e3a8a; margin-bottom: 20px; }
        input, textarea { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 15px; background-color: #f8fafc; }
        input:focus, textarea:focus { outline: none; border-color: #2563eb; background-color: #fff; }
        button { width: 100%; padding: 14px; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; transition: 0.3s; color: white; margin-top: 10px; }
        
        .btn-login { background-color: #2563eb; }
        .btn-in { background-color: #10b981; }
        .btn-out { background-color: #f59e0b; }
        .btn-history { background-color: #475569; margin-top: 20px; }
        .btn-logout { background-color: #ef4444; margin-top: 10px; }
        .btn-install { background-color: #8b5cf6; margin-bottom: 20px; display: none; }
        
        #dashboard, #historySection { display: none; }
        .status { margin-top: 10px; font-size: 13px; font-weight: 600; background: #f1f5f9; padding: 10px; border-radius: 6px; }
        .error-text { color: #ef4444; margin-top: 10px; display: none; font-size: 14px; font-weight: 600; }

        /* History Table Styles */
        .stats-grid { display: flex; gap: 10px; margin-bottom: 15px; }
        .stat-card { flex: 1; background: #f1f5f9; padding: 10px; border-radius: 8px; font-size: 12px; font-weight: bold; }
        .history-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 10px; text-align: left; }
        .history-table th, .history-table td { padding: 8px; border-bottom: 1px solid #e2e8f0; }
        .history-table th { background: #f8fafc; color: #64748b; }
    </style>
</head>
<body>

    <div class="container" id="loginBox">
        <div class="logo">Airmed Lab</div>
        <button id="installAppBtn" class="btn-install">📲 Install App on Phone</button>
        <h3 style="color: #334155; margin-bottom: 20px;">Employee Login</h3>
        <input type="text" id="empId" placeholder="Employee ID (e.g. AIRMED-001)">
        <input type="password" id="password" placeholder="PIN/Password">
        <button class="btn-login" onclick="login()">Secure Login</button>
        <div id="loginError" class="error-text"></div>
    </div>

    <!-- MAIN DASHBOARD -->
    <div class="container" id="dashboard">
        <div class="logo">Airmed Lab</div>
        <h3 id="welcomeText" style="color: #334155;">Welcome</h3>
        
        <p class="status" id="gpsStatus">⏳ Fetching GPS Location...</p>
        
        <div style="margin-top: 20px;">
            <textarea id="punchRemark" rows="2" placeholder="Any Remark? (e.g., Late due to traffic)"></textarea>
            <button class="btn-in" onclick="punch('IN')">PUNCH IN (Start Shift)</button>
            <button class="btn-out" onclick="punch('OUT')">PUNCH OUT (End Shift)</button>
        </div>
        
        <button class="btn-history" onclick="loadHistory()">View My Attendance History</button>
        <button class="btn-logout" onclick="logout()">Logout</button>
    </div>

    <!-- HISTORY DASHBOARD -->
    <div class="container" id="historySection">
        <div class="logo">My Attendance</div>
        
        <div class="stats-grid">
            <div class="stat-card" style="color:#10b981;">Present<br><span id="statPresent" style="font-size:18px;">0</span></div>
            <div class="stat-card" style="color:#f59e0b;">Missed<br><span id="statMissed" style="font-size:18px;">0</span></div>
            <div class="stat-card" style="color:#ef4444;">Errors<br><span id="statErrors" style="font-size:18px;">0</span></div>
        </div>

        <div style="max-height: 300px; overflow-y: auto;">
            <table class="history-table">
                <thead><tr><th>Date</th><th>In</th><th>Out</th><th>Status</th></tr></thead>
                <tbody id="historyBody"></tbody>
            </table>
        </div>
        
        <button class="btn-history" onclick="backToDashboard()">Back to Punch Dashboard</button>
    </div>

    <script>
        let currentLat = null, currentLng = null;

        function getGPS() {
            document.getElementById('gpsStatus').innerHTML = "⏳ Fetching GPS Location...";
            document.getElementById('gpsStatus').style.color = "#64748b";
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        currentLat = position.coords.latitude;
                        currentLng = position.coords.longitude;
                        document.getElementById('gpsStatus').innerHTML = `📍 GPS Active<br><small>${currentLat.toFixed(5)}, ${currentLng.toFixed(5)}</small>`;
                        document.getElementById('gpsStatus').style.color = "#059669";
                        document.getElementById('gpsStatus').style.background = "#d1fae5";
                    },
                    (error) => {
                        document.getElementById('gpsStatus').innerHTML = "⚠️ Enable High Accuracy GPS!";
                        document.getElementById('gpsStatus').style.color = "#dc2626";
                        document.getElementById('gpsStatus').style.background = "#fee2e2";
                    },
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                );
            }
        }

        async function login() {
            const empId = document.getElementById('empId').value.trim();
            const password = document.getElementById('password').value.trim();
            if(!empId || !password) return showError("Please enter ID and Password");
            
            try {
                const res = await fetch('/api/login', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ empId, password })
                });
                const data = await res.json();
                if (data.success) {
                    localStorage.setItem('empId', data.empId);
                    localStorage.setItem('empName', data.name);
                    showDashboard(data.name);
                } else showError(data.message);
            } catch (err) { showError("Server connection error."); }
        }

        async function punch(type) {
            const empId = localStorage.getItem('empId');
            const remark = document.getElementById('punchRemark').value.trim();

            if (!currentLat || !currentLng) {
                alert("GPS Location not found. Ensure location is ON.");
                getGPS(); return;
            }

            try {
                const res = await fetch('/api/punch', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ empId, type, lat: currentLat, lng: currentLng, remark })
                });
                const data = await res.json();
                
                if (data.success) {
                    alert(`✅ ${data.message}`);
                    document.getElementById('punchRemark').value = '';
                } else alert(`❌ Error: ${data.message}`);
            } catch (err) { alert("Connection Failed."); }
        }

        async function loadHistory() {
            document.getElementById('dashboard').style.display = 'none';
            document.getElementById('historySection').style.display = 'block';
            
            const empId = localStorage.getItem('empId');
            const res = await fetch(`/api/employee/history?empId=${empId}`);
            const data = await res.json();
            
            let presentCount = 0, missedCount = 0, errorCount = 0;
            const tbody = document.getElementById('historyBody');
            tbody.innerHTML = '';

            data.history.forEach(h => {
                if(h.status === 'Present' || h.status === 'Half Day') presentCount++;
                if(h.status === 'Miss Punch') missedCount++;
                if(h.errorLogs) errorCount++;

                const statusColor = h.status === 'Present' ? 'color:#10b981' : (h.status === 'Miss Punch' ? 'color:#ef4444' : 'color:#f59e0b');
                tbody.innerHTML += `<tr>
                    <td>${h.date}</td>
                    <td>${h.entryTime || '-'}</td>
                    <td>${h.exitTime || '-'}</td>
                    <td style="font-weight:bold; ${statusColor}">${h.status}</td>
                </tr>`;
            });

            document.getElementById('statPresent').innerText = presentCount;
            document.getElementById('statMissed').innerText = missedCount;
            document.getElementById('statErrors').innerText = errorCount;
        }

        function backToDashboard() {
            document.getElementById('historySection').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
        }

        function logout() {
            localStorage.clear();
            document.getElementById('dashboard').style.display = 'none';
            document.getElementById('historySection').style.display = 'none';
            document.getElementById('loginBox').style.display = 'block';
        }

        function showError(msg) {
            const err = document.getElementById('loginError');
            err.innerText = msg; err.style.display = 'block';
        }

        function showDashboard(name) {
            document.getElementById('loginBox').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
            document.getElementById('welcomeText').innerText = `Welcome, ${name}`;
            getGPS();
        }

        // Init Check
        if (localStorage.getItem('empId')) showDashboard(localStorage.getItem('empName'));

        // PWA Script
        let deferredPrompt;
        const installBtn = document.getElementById('installAppBtn');
        if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');
        window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredPrompt = e; installBtn.style.display = 'block'; });
        installBtn.addEventListener('click', async () => { installBtn.style.display = 'none'; deferredPrompt.prompt(); deferredPrompt = null; });
    </script>
</body>
</html>

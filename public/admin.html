<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Airmed Lab - Admin Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #f8fafc; color: #1e293b; }
        .navbar { background: #1e3a8a; color: white; padding: 15px 20px; font-size: 20px; font-weight: bold; }
        .main-container { display: flex; flex-wrap: wrap; padding: 20px; gap: 20px; }
        .panel { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); flex: 1; min-width: 300px; }
        .wide-panel { flex: 2; min-width: 600px; }
        h3 { margin-bottom: 15px; color: #1e3a8a; border-bottom: 2px solid #e2e8f0; padding-bottom: 5px; }
        input, select, button { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; }
        button { background: #2563eb; color: white; font-weight: bold; border: none; cursor: pointer; transition: 0.2s; }
        button:hover { background: #1d4ed8; }
        .btn-disable { background: #ef4444; }
        .btn-disable:hover { background: #dc2626; }
        .btn-active { background: #10b981; }
        #map { height: 350px; border-radius: 8px; margin-bottom: 10px; border: 2px solid #cbd5e1; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 13px; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #e2e8f0; }
        th { background: #f1f5f9; }
        .badge { padding: 4px 8px; border-radius: 20px; font-size: 11px; font-weight: bold; }
        .b-green { background: #d1fae5; color: #065f46; }
        .b-red { background: #fee2e2; color: #991b1b; }
        .b-orange { background: #ffedd5; color: #9a3412; }
    </style>
</head>
<body>

    <div class="navbar"><i class="fas fa-flask"></i> Airmed Lab - Admin HR & Tracking Panel</div>

    <div class="main-container">
        
        <div class="panel wide-panel">
            <h3><i class="fas fa-map-marked-alt"></i> Clinic Geofence Management (Click Map to Drop Circle)</h3>
            <div id="map"></div>
            <div style="display:flex; gap: 10px;">
                <input type="text" id="locName" placeholder="Clinic Name">
                <input type="text" id="locLat" placeholder="Lat" readonly>
                <input type="text" id="locLng" placeholder="Lng" readonly>
                <button onclick="saveClinic()" style="width:150px; background:#10b981;">Save Clinic</button>
            </div>
            <table id="locationTable">
                <thead><tr><th>Clinic Name</th><th>Latitude</th><th>Longitude</th><th>Action</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>

        <div class="panel">
            <h3><i class="fas fa-user-plus"></i> Add / Edit Employee</h3>
            <input type="hidden" id="empDbId">
            <input type="text" id="empId" placeholder="Employee ID (AIRMED-001)">
            <input type="text" id="empName" placeholder="Full Name">
            <input type="text" id="empPassword" placeholder="PIN/Password">
            <input type="text" id="empPhone" placeholder="WhatsApp Number">
            <button onclick="saveEmployee()">Save Employee Data</button>
            
            <h4 style="margin-top:20px;">Staff Directory</h4>
            <div style="overflow-x:auto; max-height:200px;">
                <table id="staffTable">
                    <thead><tr><th>Name (ID)</th><th>Status</th><th>Actions</th></tr></thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="main-container" style="padding-top:0;">
        <div class="panel wide-panel">
            <h3><i class="fas fa-file-invoice"></i> Attendance Reports & Salary Engine</h3>
            <div style="display:flex; gap:10px; align-items:center;">
                <input type="date" id="repFrom">
                <span>To</span>
                <input type="date" id="repTo">
                <select id="repEmpFilter"><option value="">-- All Staff --</option></select>
                <button onclick="loadReports()" style="background:#4f46e5;">Generate Report</button>
                <button onclick="shareMissPunches()" style="background:#25d366; width:220px;"><i class="fab fa-whatsapp"></i> Share Miss Punches</button>
            </div>

            <table id="reportTable">
                <thead><tr><th>Date</th><th>ID</th><th>Punch In</th><th>Punch Out</th><th>Status</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <script>
        let map, markers = [], fenceCircles = [], currentSelectedLatLng = null;

        function initMap() {
            map = L.map('map').setView([23.0300, 72.5800], 12);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
            
            map.on('click', function(e) {
                document.getElementById('locLat').value = e.latlng.lat.toFixed(6);
                document.getElementById('locLng').value = e.latlng.lng.toFixed(6);
                if(window.tempCircle) map.removeLayer(window.tempCircle);
                window.tempCircle = L.circle([e.latlng.lat, e.latlng.lng], {color: 'orange', radius: 150}).addTo(map);
            });
        }

        // CLINICS LOGIC
        async function loadClinics() {
            const res = await fetch('/api/admin/locations');
            const data = await res.json();
            const tbody = document.querySelector('#locationTable tbody');
            tbody.innerHTML = '';
            fenceCircles.forEach(c => map.removeLayer(c));
            fenceCircles = [];

            data.forEach(loc => {
                tbody.innerHTML += `<tr><td>${loc.name}</td><td>${loc.lat}</td><td>${loc.lng}</td><td><button class="btn-disable" onclick="deleteClinic('${loc._gid || loc._id}')">Delete</button></td></tr>`;
                let c = L.circle([loc.lat, loc.lng], {color: '#1e3a8a', radius: 150}).addTo(map).bindPopup(loc.name);
                fenceCircles.push(c);
            });
        }

        async function saveClinic() {
            const name = document.getElementById('locName').value;
            const lat = document.getElementById('locLat').value;
            const lng = document.getElementById('locLng').value;
            if(!name || !lat) return alert("Map par click karein aur Clinic ka naam likhein!");

            await fetch('/api/admin/locations', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({name, lat: parseFloat(lat), lng: parseFloat(lng)})
            });
            alert("Clinic Saved!");
            document.getElementById('locName').value = '';
            loadClinics();
        }

        async function deleteClinic(id) {
            if(!confirm("Kya aap is clinic geofence ko hatana chahte hain?")) return;
            await fetch(`/api/admin/locations/${id}`, { method: 'DELETE' });
            loadClinics();
        }

        // STAFF DIRECTORY
        async function loadStaff() {
            const res = await fetch('/api/admin/employees');
            const emps = await res.json();
            const tbody = document.querySelector('#staffTable tbody');
            const filterSelect = document.getElementById('repEmpFilter');
            
            tbody.innerHTML = '';
            filterSelect.innerHTML = '<option value="">-- All Staff --</option>';

            emps.forEach(emp => {
                filterSelect.innerHTML += `<option value="${emp.empId}">${emp.name}</option>`;
                const badgeColor = emp.status === 'active' ? 'b-green' : 'b-red';
                const toggleAction = emp.status === 'active' ? 'disabled' : 'active';
                const toggleBtnText = emp.status === 'active' ? 'Disable' : 'Activate';
                const btnClass = emp.status === 'active' ? 'btn-disable' : 'btn-active';

                tbody.innerHTML += `<tr>
                    <td><b>${emp.name}</b><br><small>${emp.empId}</small></td>
                    <td><span class="badge ${badgeColor}">${emp.status}</span></td>
                    <td>
                        <button style="padding:4px; margin-bottom:2px;" onclick="editEmp('${emp._id}','${emp.empId}','${emp.name}','${emp.password}','${emp.phone}')">Edit</button>
                        <button class="${btnClass}" style="padding:4px;" onclick="toggleStatus('${emp._id}','${toggleAction}')">${toggleBtnText}</button>
                    </td>
                </tr>`;
            });
        }

        async function saveEmployee() {
            const id = document.getElementById('empDbId').value;
            const empId = document.getElementById('empId').value;
            const name = document.getElementById('empName').value;
            const password = document.getElementById('empPassword').value;
            const phone = document.getElementById('empPhone').value;

            if(!empId || !name || !password) return alert("Puri details bharein!");

            const res = await fetch('/api/admin/employees', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({id: id || undefined, empId, name, password, phone})
            });
            const result = await res.json();
            alert(result.message);
            
            // Fields Reset
            document.getElementById('empDbId').value = '';
            document.getElementById('empId').value = '';
            document.getElementById('empName').value = '';
            document.getElementById('empPassword').value = '';
            document.getElementById('empPhone').value = '';
            loadStaff();
        }

        function editEmp(id, empId, name, pass, phone) {
            document.getElementById('empDbId').value = id;
            document.getElementById('empId').value = empId;
            document.getElementById('empName').value = name;
            document.getElementById('empPassword').value = pass;
            document.getElementById('empPhone').value = phone;
        }

        async function toggleStatus(id, status) {
            await fetch('/api/admin/employees/status', {
                method: 'PUT',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({id, status})
            });
            loadStaff();
        }

        // REPORTS LOGIC
        async function loadReports() {
            const from = document.getElementById('repFrom').value;
            const to = document.getElementById('repTo').value;
            const empId = document.getElementById('repEmpFilter').value;

            let url = `/api/admin/reports?`;
            if(from && to) url += `from=${from}&to=${to}&`;
            if(empId) url += `empId=${empId}`;

            const res = await fetch(url);
            window.currentReportData = await res.json(); // Save globally for WhatsApp share
            
            const tbody = document.querySelector('#reportTable tbody');
            tbody.innerHTML = '';

            window.currentReportData.forEach(p => {
                let badge = 'b-red';
                if(p.status === 'Present') badge = 'b-green';
                if(p.status === 'Half Day') badge = 'b-orange';

                tbody.innerHTML += `<tr>
                    <td>${p.date}</td>
                    <td><b>${p.empId}</b></td>
                    <td>${p.entryTime || '-'}</td>
                    <td>${p.exitTime || '-'}</td>
                    <td><span class="badge ${badge}">${p.status}</span></td>
                </tr>`;
            });
        }

        // WHATSAPP SHARE MISS PUNCH LIST ENQUIRY
        function shareMissPunches() {
            if(!window.currentReportData || window.currentReportData.length === 0) {
                return alert("Pehle upar se report generate karein jisme se miss punch filter ho sake!");
            }
            let missPunches = window.currentReportData.filter(p => p.status === "Miss Punch");
            if(missPunches.length === 0) return alert("Chuni hui date range me koi bhi Miss Punch nahi mila!");

            let message = `*Airmed Lab - Attendance Miss Punch Alert*\n\n`;
            missPunches.forEach((p, idx) => {
                message += `${idx+1}. Emp ID: ${p.empId}\n   Date: ${p.date}\n   In-Time: ${p.entryTime || 'Missing'}\n   Out-Time: ${p.exitTime || 'Missing'}\n\n`;
            });
            message += `Kripya apna checkout verify karvayein.`;
            
            window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(message)}`, '_blank');
        }

        document.addEventListener('DOMContentLoaded', () => {
            initMap();
            loadClinics();
            loadStaff();
            
            // Set default date to today
            document.getElementById('repFrom').value = new Date().toISOString().split('T')[0];
            document.getElementById('repTo').value = new Date().toISOString().split('T')[0];
            loadReports();
        });
    </script>
</body>
</html>
